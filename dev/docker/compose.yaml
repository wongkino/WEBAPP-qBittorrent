services:
  web:
    build:
      context: ../..
      dockerfile: dev/docker/Dockerfile
    env_file:
      - ../../.env.development.local
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ../..:/app
      - web_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  web_node_modules:
